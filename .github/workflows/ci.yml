name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs against the template's wrangler.jsonc (wrangler.local.jsonc is not
      # in Git), so everything here is local: no Cloudflare credential is
      # needed and nothing touches production.
      - name: Prepare test environment
        run: |
          {
            echo "BETTER_AUTH_SECRET=\"$(openssl rand -base64 32)\""
            echo 'BETTER_AUTH_URL="http://localhost:4321"'
            echo "SETUP_SECRET=\"$(openssl rand -hex 16)\""
            echo 'RESEND_API_KEY=""'
            echo 'EMAIL_FROM="CI <no-reply@exemplo.com>"'
          } > .dev.vars

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      - name: Migrations on the local database
        run: npm run db:local

      - name: Start the server
        run: |
          npm run dev > /tmp/dev.log 2>&1 &
          for i in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4321/login)" = "200" ]; then
              echo "server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::the server did not start within 60s"; cat /tmp/dev.log; exit 1

      - name: End-to-end suite
        run: npm run smoke

      - name: Server log (when something fails)
        if: failure()
        run: cat /tmp/dev.log || true
